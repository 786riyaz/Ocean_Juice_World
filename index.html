<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ocean Juice World — Peel the Fruit Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>
  <div class="bg-decor">
    <div class="droplet-pattern"></div>
    <div class="citrus-slice tl"></div>
    <div class="citrus-slice br"></div>
    <div class="kiwi-slice"></div>
    <div class="plum-glow"></div>
    <div class="mango-glow"></div>
    <div class="pineapple-pattern"></div>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
    <div class="bubble b6"></div>
    <div class="wave wave2"></div>
    <div class="wave"></div>
  </div>
  <div class="app">
    <img class="logo" src="images/Logo_The_Ocean_Juice_World.png" alt="The Ocean Juice World logo">

    <div class="main-content">
      <div class="sub">pick a fruit to open its menu</div>

      <div class="bowl" id="bowl"></div>

      <div class="info-section">
        <div class="info-note"></div>

        <a class="phone-card" href="tel:+919664999965">📞 +91 96649 99965</a>

        <div class="action-row">
          <a class="action-btn" target="_blank"
            href="https://www.google.com/search?hl=en-IN&gl=in&q=THE+OCEAN+JUICE+WORLD,+sanjivani+complex,+opp.+mig+colony,+near+bank+of+baroda,+Summair+Club+Road,+Jamnagar,+Gujarat+361006&ludocid=15947737739859879496&lsig=AB86z5Vve4Xmn0Mxp6maGISmYAmA#lrd=0x39576b08a923496f:0xdd51befacb706648,3">⭐
            Review Us</a>
          <a class="action-btn" target="_blank"
            href="https://www.instagram.com/the_ocean_juiceworld?igsh=MXMxODdxd3NiNXp1bQ=="><svg
              xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="vertical-align:-2px;margin-right:4px">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>Instagram</a>
        </div>
      </div>
    </div>

    <div class="designed-by">
      Designed By :
      <a href="https://www.instagram.com/aim__enterprise?igsh=MTk3Y281bXB6bXp2Ng%3D%3D" target="_blank">Aim Enterprise</a>
    </div>

    <div class="peel-overlay" id="peelOverlay">
      <button class="peel-close" id="peelClose">✕</button>
      <div class="peel-title" id="peelTitle"><img src="images/Logo_The_Ocean_Juice_World.png" alt="logo"><span
          id="peelTitleText"></span></div>
      <div class="peel-stage" id="peelStage">
        <div class="stage-emoji" id="stageEmoji"></div>
        <div class="page-window" id="pageWindow">
          <img id="pageImg" src="images/Logo_The_Ocean_Juice_World.png" alt="menu page">
        </div>
        <div class="half left">
          <div class="skin" id="skinLeft"></div>
          <div class="rim"></div>
        </div>
        <div class="half right">
          <div class="skin" id="skinRight"></div>
          <div class="rim"></div>
        </div>
        <div class="page-nav" id="pageNav">
          <button id="pPrev">‹</button>
          <span class="lbl"><span id="pLabel">1</span>/<span id="pTotal">1</span></span>
          <button id="pNext">›</button>
        </div>
        <div class="hint">tap the page to zoom</div>
      </div>
    </div>

    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lbClose">✕</button>
      <img id="lbImg" src="images/Logo_The_Ocean_Juice_World.png" alt="menu page">
    </div>
</body>
<script src="scripts/script.js"></script>

</html>
